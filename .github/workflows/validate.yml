name: Preview validation
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test non-root installation profile
        run: |
          python3 tests/test_ci_profile.py
          python3 tests/test_ci_texlive.py
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y perl curl poppler-utils fontconfig
      # Current-network installer, NOT a hermetically pinned image. Fail closed
      # if the network moves to another TeX Live major release.
      - name: Install TeX Live 2026
        run: bash tests/ci_texlive.sh
      - run: python3 tests/preflight.py
      - run: python3 tests/compile_all.py
      - run: python3 tests/boundaries.py
      - run: python3 tests/structure.py
      - run: python3 tests/release_audit.py
