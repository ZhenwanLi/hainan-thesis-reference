name: Preview validation
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y perl curl poppler-utils fontconfig
      # Current-network installer, NOT a hermetically pinned image. Fail closed
      # if the network moves to another TeX Live major release.
      - name: Install TeX Live 2026
        run: |
          curl --fail --location --retry 3 https://mirror.ctan.org/systems/texlive/tlnet/install-tl-unx.tar.gz -o "$RUNNER_TEMP/install-tl.tar.gz"
          mkdir "$RUNNER_TEMP/tex-installer"
          tar -xzf "$RUNNER_TEMP/install-tl.tar.gz" -C "$RUNNER_TEMP/tex-installer" --strip-components=1
          printf '%s\n' 'selected_scheme scheme-small' "TEXDIR $RUNNER_TEMP/texlive" 'option_doc 0' 'option_src 0' > "$RUNNER_TEMP/profile"
          perl "$RUNNER_TEMP/tex-installer/install-tl" -profile "$RUNNER_TEMP/profile"
          echo "$RUNNER_TEMP/texlive/bin/x86_64-linux" >> "$GITHUB_PATH"
      - name: Install collections and check version
        run: |
          tlmgr --version | grep 'version 2026'
          tlmgr install collection-xetex collection-langchinese collection-latexextra collection-fontsrecommended collection-bibtexextra collection-pictures collection-science
      - run: python3 tests/preflight.py
      - run: python3 tests/compile_all.py
      - run: python3 tests/boundaries.py
      - run: python3 tests/structure.py
      - run: python3 tests/release_audit.py
